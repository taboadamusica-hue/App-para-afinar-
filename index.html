<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Afinador IA</title>
  <meta name="description" content="Afinador con asistente de IA privado, proactivo y con recordatorios.">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Afinador <span>IA</span></h1>
    <span class="privacy" title="Sin servidores: todo se procesa y se guarda en este dispositivo">🔒 Privado · en tu dispositivo</span>
    <button id="openSettings" class="icon-btn" aria-label="Ajustes">⚙</button>
  </header>

  <main>
    <section class="tuner" aria-live="polite">
      <div id="gauge" class="gauge">
        <div class="scale"><span>-50</span><span>0</span><span>+50</span></div>
        <div class="arc"></div>
        <div id="needle" class="needle"></div>
      </div>
      <div class="reading">
        <span id="note" class="note">–</span><sub id="octave"></sub>
      </div>
      <p id="cents" class="cents">Toca una cuerda</p>
      <p id="freq" class="freq"></p>
      <div id="strings" class="strings"></div>
      <button id="toggle" class="primary">Empezar</button>
    </section>

    <section class="assistant">
      <h2>Tu asistente</h2>
      <div id="feed" class="feed" role="log"></div>
      <div class="quick">
        <button data-quick="¿Cómo voy?">¿Cómo voy?</button>
        <button data-quick="¿Qué cuerda se desafina más?">Cuerda más inestable</button>
        <button data-quick="Dame un consejo">Consejo</button>
      </div>
      <form id="ask">
        <input id="question" autocomplete="off" placeholder="Pregúntame algo…" aria-label="Pregunta al asistente">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Ajustes</h2>
      <label>Instrumento <select id="instrument"></select></label>
      <label>La de referencia (Hz) <input id="a4" type="number" min="415" max="460" step="1"></label>
      <label class="check"><input id="proactive" type="checkbox"> Asistente proactivo (consejos y avisos mientras afinas)</label>

      <fieldset>
        <legend>Recordatorio recurrente</legend>
        <label class="check"><input id="reminderOn" type="checkbox"> Recordarme afinar y practicar</label>
        <label>Hora <input id="reminderTime" type="time"></label>
        <div id="days" class="days">
          <label><input type="checkbox" value="1">L</label>
          <label><input type="checkbox" value="2">M</label>
          <label><input type="checkbox" value="3">X</label>
          <label><input type="checkbox" value="4">J</label>
          <label><input type="checkbox" value="5">V</label>
          <label><input type="checkbox" value="6">S</label>
          <label><input type="checkbox" value="0">D</label>
        </div>
        <label class="check"><input id="weekly" type="checkbox"> Resumen semanal los lunes</label>
        <p id="notifStatus" class="hint"></p>
        <button type="button" id="notifBtn">Permitir notificaciones</button>
      </fieldset>

      <fieldset>
        <legend>Privacidad</legend>
        <p class="hint">El asistente no usa internet: el audio se analiza en el momento y no se graba. Lo que aprende se guarda solo en este navegador.</p>
        <div class="row">
          <button type="button" id="export">Exportar memoria</button>
          <button type="button" id="wipe" class="danger">Borrar memoria</button>
        </div>
      </fieldset>

      <button id="closeSettings" class="primary">Listo</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
